name: Selenium Java Tests & Docker Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  selenium-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Set up Chrome Browser
        uses: browser-actions/setup-chrome@v1

      - name: Verify Java and Chrome Versions
        run: |
          java -version
          google-chrome --version

      # Automatically updates the target hosted address to a secure relative local file path on the cloud machine
      - name: Run Selenium Test Suite
        run: |
          sed -i 's|http://web-app/login.html|file:///${{ github.workspace }}/webapp/login.html|g' src/test/java/selenium/LoginTest.java
          mvn clean test
