name: Selenium Java Tests & Docker Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  selenium-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      # Using the updated market version to comply with environment constraints
      - name: Set up Chrome Browser
        uses: browser-actions/setup-chrome@v3
        with:
          chrome-version: stable

      - name: Verify Java and Chrome Versions
        run: |
          java -version
          google-chrome --version

      # Workaround: Automatically swap the hosted URL back to a local path file just for GitHub
      - name: Run Selenium Test Suite
        run: |
          sed -i 's|http://web-app/login.html|file:///${{ github.workspace }}/webapp/login.html|g' src/test/java/selenium/LoginTest.java
          mvn clean test
