name: Selenium Java Tests & Docker Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  selenium-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Uses the clean, stable setup approach matching your working local structure
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Set up Chrome Browser
        uses: browser-actions/setup-chrome@v1

      - name: Verify Java and Chrome Versions
        run: |
          java -version
          google-chrome --version

      - name: Run Selenium Test Suite
        run: mvn clean test
